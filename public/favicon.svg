<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background Glow -->
  <rect width="64" height="64" rx="16" fill="#121418"/>
  <rect width="60" height="60" x="2" y="2" rx="14" fill="url(#bg_grad)" stroke="#863bff" stroke-opacity="0.4" stroke-width="2"/>
  
  <!-- Open Book Symbol -->
  <!-- Left Page -->
  <path d="M14 20C14 20 22 17 32 21V46C22 42 14 45 14 45V20Z" fill="url(#page_left)" stroke="#a855f7" stroke-width="1.5"/>
  <!-- Right Page -->
  <path d="M50 20C50 20 42 17 32 21V46C42 42 50 45 50 45V20Z" fill="url(#page_right)" stroke="#c084fc" stroke-width="1.5"/>
  <!-- Spine Line -->
  <path d="M32 21V46" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Crown / Star Accent -->
  <path d="M32 11L34.5 15.5L39.5 16.2L35.8 19.7L36.7 24.7L32 22.2L27.3 24.7L28.2 19.7L24.5 16.2L29.5 15.5L32 11Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="0.5"/>
  
  <!-- Page Lines Accent -->
  <path d="M19 28H27M19 33H27M19 38H24" stroke="#e9d5ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M37 28H45M37 33H45M40 38H45" stroke="#e9d5ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0f091a"/>
    </linearGradient>
    <linearGradient id="page_left" x1="14" y1="20" x2="32" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#863bff"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="page_right" x1="50" y1="20" x2="32" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
  </defs>
</svg>